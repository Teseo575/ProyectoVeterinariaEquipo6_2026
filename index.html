<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Registro | KAT0</title>

  <!-- =====================================================
       BOOTSTRAP
  ====================================================== -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    /* =====================================================
       ESTILOS PROPIOS
       Son solamente los estilos visuales de la página.
    ====================================================== */

    :root {
      --clr-veterinaria: #02A2EC;
      --clr-principal: #02A2EC;
      --clr-peligro: #ff7782;
      --clr-exito: #41f1b6;
      --clr-blanco: #fff;
      --clr-info-oscuro: #7d8da1;
      --clr-info-claro: #dce1eb;
      --clr-oscuro: #363949;
      --clr-advertencia: #ff4edc;
      --clr-claro: rgba(132, 139, 200, 0.18);
      --clr-variante-principal: #111e88;
      --clr-variante-oscura: #677483;
      --clr-fondo: #f6f6f9;
      --sombra-caja: 0 2rem 3rem var(--clr-claro);
      --verde-oscuro: var(--clr-oscuro);
      --verde-medio: var(--clr-principal);
      --verde-suave: var(--clr-fondo);
      --blanco: var(--clr-blanco);
      --gris: var(--clr-variante-oscura);
      --negro: var(--clr-oscuro);
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, var(--verde-suave) 0%, #f7fbf8 100%);
      min-height: 100vh;
    }

    .contenedor-registro {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .tarjeta-registro {
      width: 100%;
      max-width: 980px;
      background: var(--blanco);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--sombra-caja);
    }

    .lado-imagen {
      min-height: 620px;
      background-image: url("Veterinaria(perros).jpg");
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .lado-imagen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(54, 57, 73, 0.45);
    }

    .texto-imagen {
      position: absolute;
      z-index: 1;
      bottom: 0;
      padding: 40px 30px;
      color: white;
    }

    .texto-imagen h1 {
      font-size: 3rem;
      font-weight: 700;
    }

    .formulario {
      padding: 42px 34px;
    }

    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 18px;
      object-fit: contain;
    }

    .logos-registro {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .titulo {
      color: var(--negro);
      text-align: center;
      font-weight: 700;
    }

    .subtitulo {
      color: var(--gris);
      text-align: center;
    }

    .btn-kat0 {
      background: var(--verde-medio);
      color: white;
      border: none;
      font-weight: 700;
    }
    .btn-kat0:hover {
      background: var(--clr-variante-principal);
      color: white;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="contenedor-registro">

    <div class="tarjeta-registro">

      <div class="row g-0">

        <!-- =================================================
             PARTE IZQUIERDA
        ================================================== -->
        <div class="col-lg-6 lado-imagen">

          <div class="texto-imagen">
            <h1>Veterinaria<br>Animalada</h1>

            <p>
              Cuidamos a tus mascotas como si fueran parte de la familia.
            </p>
          </div>

        </div>


        <!-- =================================================
             PARTE DERECHA
        ================================================== -->
        <div class="col-lg-6 formulario">

          <div class="logos-registro">
            <img class="logo" src="imgs/KAT0.png" alt="Logo KAT0">
            <img class="logo" src="imgs/LogoVeterinaria.png" alt="Logo de Veterinaria Animalada">
          </div>

          <h2 class="titulo">Crear cuenta</h2>

          <p class="subtitulo mb-4">
            Completá los datos para comenzar
          </p>


          <!-- =================================================
               FORMULARIO

               Cuando el usuario presione "Registrarme":

               1. Los datos se envían por POST.
               2. Van a registro.php.
               3. registro.php los guarda en MySQL.
               4. Si todo sale bien, manda al menu.php.
          ================================================== -->

          <form action="registro.php" method="POST">

            <!-- NOMBRE -->
            <div class="mb-3">
              <label for="nombre" class="form-label">
                Nombre
              </label>

              <input
                type="text"
                class="form-control"
                id="nombre"
                name="Nombre"
                placeholder="Tu nombre"
                required
              >
            </div>


            <!-- APELLIDO -->
            <div class="mb-3">
              <label for="apellido" class="form-label">
                Apellido
              </label>

              <input
                type="text"
                class="form-control"
                id="apellido"
                name="Apellido"
                placeholder="Tu apellido"
                required
              >
            </div>


            <!-- CI -->
            <div class="mb-3">
              <label for="ci" class="form-label">
                CI
              </label>

              <input
                type="text"
                class="form-control"
                id="ci"
                name="CI"
                placeholder="Tu CI"
                required
              >
            </div>


            <!-- DIRECCION -->
            <div class="mb-3">
              <label for="direccion" class="form-label">
                Dirección
              </label>

              <input
                type="text"
                class="form-control"
                id="direccion"
                name="Direccion"
                placeholder="Tu dirección"
                required
              >
            </div>


            <!-- DEPARTAMENTO -->
            <div class="mb-3">
              <label for="departamento" class="form-label">
                Departamento
              </label>

              <input
                type="text"
                class="form-control"
                id="departamento"
                name="Departamento"
                placeholder="Tu departamento"
                required
              >
            </div>


            <!-- GMAIL -->
            <div class="mb-3">
              <label for="gmail" class="form-label">
                Gmail
              </label>

              <input
                type="email"
                class="form-control"
                id="gmail"
                name="Gmail"
                placeholder="tuemail@gmail.com"
                required
              >
            </div>


            <!-- CONTRASEÑA -->
            <div class="mb-4">
              <label for="pass" class="form-label">
                Contraseña
              </label>

              <input
                type="password"
                class="form-control"
                id="pass"
                name="Contrasena"
                placeholder="••••••••"
                required
              >
            </div>


            <!-- BOTÓN -->
            <button
              type="submit"
              class="btn btn-kat0 w-100 py-2"
            >
              Registrarme
            </button>

            <p class="text-center mt-3 mb-0">
              ¿Ya tenés cuenta? <a href="login.php">Iniciar sesión</a>
            </p>

          </form>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
