<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro | KAT0</title>
  <style>
    :root {
      --verde-oscuro: #4d7e68;
      --verde-medio: #7ea88d;
      --verde-claro: #dfeee6;
      --verde-suave: #edf7f0;
      --blanco: #ffffff;
      --gris: #53646d;
      --negro: #1d2a22;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, var(--verde-suave) 0%, #f7fbf8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .contenedor {
      width: 100%;
      max-width: 980px;
      display: flex;
      background: var(--blanco);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(77, 126, 104, 0.15);
    }

    .lado-izquierdo {
      flex: 1.05;
      background-image: url("Veterinaria.jpg");
      background-size: cover;
      background-position: center;
      position: relative;
      min-height: 620px;
    }

    .lado-izquierdo::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(25, 62, 48, 0.45);
    }

    .lado-izquierdo .texto {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px 30px;
      color: var(--blanco);
    }

    .lado-izquierdo h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .lado-izquierdo p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 360px;
    }

    .lado-derecho {
      flex: 1;
      background: var(--blanco);
      padding: 42px 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .caja-form {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      display: block;
      margin: 0 auto 18px;
      width: 150px;
      height: auto;
    }

    h2 {
      margin: 0 0 8px;
      text-align: center;
      color: var(--negro);
      font-size: 2rem;
    }

    .subtitulo {
      margin: 0 0 22px;
      text-align: center;
      color: var(--gris);
      font-size: 0.96rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      color: var(--negro);
      font-size: 0.96rem;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5dfd8;
      border-radius: 12px;
      background: #f9fbfa;
      font-size: 1rem;
      color: var(--negro);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--verde-medio);
      box-shadow: 0 0 0 4px rgba(126, 168, 141, 0.16);
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--verde-medio) 0%, var(--verde-oscuro) 100%);
      color: var(--blanco);
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 18px rgba(77, 126, 104, 0.2);
    }

    button:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 820px) {
      .contenedor {
        flex-direction: column;
      }

      .lado-izquierdo {
        min-height: 300px;
      }

      .lado-derecho {
        padding: 30px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="lado-izquierdo">
      <div class="texto">
        <h1>Veterinaria<br />Animalada</h1>
        <p>Cuidamos a tus mascotas como si fueran parte de la familia.</p>
      </div>
    </div>

    <div class="lado-derecho">
      <div class="caja-form">
        <img class="logo" src="KAT0 (Principal).png" alt="Logo KAT0" />
        <h2>Crear cuenta</h2>
        <p class="subtitulo">Completá los datos para comenzar</p>

        <form action="login.php" method="POST" accept-charset="UTF-8">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="Nombre" placeholder="Tu nombre" required />
          </div>

          <div class="campo">
            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" name="Gmail" placeholder="tuemail@gmail.com" required />
          </div>

          <div class="campo">
            <label for="pass">Contraseña</label>
            <input type="password" id="pass" name="Contraseña" placeholder="••••••••" required />
          </div>

          <button type="submit">Registrarme</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
